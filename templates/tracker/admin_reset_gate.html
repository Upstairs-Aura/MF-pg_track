<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — pg_trac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'tracker/styles.css' %}">
</head>
<body class="login-body">

<div class="login-card">
    <div class="brand brand--center">
        <span class="brand-mark" aria-hidden="true"></span>
        pg_trac
    </div>
    <p class="login-sub">Admin access</p>

    <form method="post" class="login-form">
        {% csrf_token %}
        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}
        <label class="field-label" for="id_admin_password">Admin password</label>
        <input class="field-input" type="password" id="id_admin_password" name="admin_password" autofocus required>
        <button type="submit" class="btn btn--primary btn--full">Continue</button>
    </form>
</div>

</body>
</html>
